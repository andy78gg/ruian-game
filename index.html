<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruian Game · 地形原型</title>
  <link rel="stylesheet" href="css/style.css?v=19" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div class="title">Ruian Game · 地形与树木原型</div>
    <div class="tips">点击画面锁定鼠标 · WASD 移动 · Shift 奔跑 · 空格跳跃 · E 背包 · 鼠标控制视角</div>
  </div>

  <div id="phase"></div>

  <div id="resources">
    <span>🪵 <b id="wood-count">0</b></span>
    <span>🪨 <b id="stone-count">0</b></span>
  </div>

  <div id="gather-tip"></div>
  <div id="build-hint"></div>
  <div id="dbg" style="position:fixed;top:60px;left:10px;color:#fff;font-size:12px;z-index:99;text-shadow:0 1px 2px #000"></div>

  <div id="status">
    <div class="bar-row">
      <span class="bar-label">生命值</span>
      <div class="bar"><div id="health-bar" class="fill health"></div></div>
    </div>
    <div class="bar-row">
      <span class="bar-label">食物</span>
      <div class="bar"><div id="food-bar" class="fill food"></div></div>
    </div>
  </div>

  <div id="hotbar"></div>

  <div id="inventory-panel">
    <div class="inv-title">背包 <span class="inv-hint">按 E 关闭</span></div>
    <div class="inv-tabs">
      <button class="inv-tab active" data-pane="bag">背包</button>
      <button class="inv-tab" data-pane="craft">制作</button>
    </div>
    <div class="inv-pane active" id="pane-bag">
      <div class="mc-section">物品栏 · 4 排</div>
      <div class="mc-grid inv-stash" id="inv-items"></div>
      <div class="mc-section">快捷栏</div>
      <div class="mc-grid" id="inv-hotbar"></div>
    </div>
    <div class="inv-pane" id="pane-craft">
      <div class="mc-section">合成</div>
      <div id="inv-recipes"></div>
    </div>
  </div>

  <div id="crosshair"></div>

  <div id="hurt-overlay"></div>

  <div id="death-screen">
    <div class="death-title">你死了</div>
    <div class="death-sub">正在重生…</div>
  </div>

  <script type="module" src="js/main.js?v=19"></script>
</body>
</html>
